<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- Login Section -->
        <div id="login-box">
            <h2>Welcome Back</h2>
            <form>
                <div class="input-group">
                    <input type="email" required>
                    <label>Email Address</label>
                </div>
                <div class="input-group">
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p class="switch-text">New here? <a href="javascript:void(0)" onclick="toggleForm()">Create account</a></p>
        </div>

        <!-- Sign Up Section -->
        <div id="signup-box" class="hidden">
            <h2>Create Account</h2>
            <form>
                <div class="input-group">
                    <input type="text" required>
                    <label>Full Name</label>
                </div>
                <div class="input-group">
                    <input type="email" required>
                    <label>Email Address</label>
                </div>
                <div class="input-group">
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p class="switch-text">Already a member? <a href="javascript:void(0)" onclick="toggleForm()">Login here</a></p>
        </div>
    </div>

    <script>
        function toggleForm() {
            document.getElementById('login-box').classList.toggle('hidden');
            document.getElementById('signup-box').classList.toggle('hidden');
        }
    </script>
</body>
</html>
